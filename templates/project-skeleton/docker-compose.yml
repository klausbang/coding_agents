services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      MAIL_SERVER: mailpit
      MAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "if [ -d migrations ]; then flask --app wsgi db upgrade; fi &&
             gunicorn --bind 0.0.0.0:8000 --reload --access-logfile - wsgi:app"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
