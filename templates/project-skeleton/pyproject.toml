[project]
name = "{{PROJECT_SLUG}}"
version = "0.1.0"
description = "{{PROJECT_NAME}}"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
e2e = [
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    "pytest-bdd>=7.0",
    "schemathesis>=3.30",
    "locust>=2.31",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ac(id): acceptance criterion verified by this test (AC-NNN.N)",
    "tc(id): verification test case id (TC-NNN)",
    "integration: needs PostgreSQL via TEST_DATABASE_URL",
    "contract: OpenAPI contract tests",
    "system: end-to-end / load tests against a deployed environment",
    "security: security tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true
